# Melon-trained era classifier — the reverse-direction model (Section 5.4 of the paper).
# Trained on the 1,662-track artist-disjoint Melon train split, three seeds.
#
#   python train.py --config-name=packed_melon_clean model=Baseline train.seed=77
#
# Note this trains on `csv/kpop_artist_split.json`, i.e. the artist-disjoint split, so the
# 305-song Melon test set is genuinely held out. Reported in-domain macro accuracy: 52.4 %.

hydra:
  run:
    dir: .

defaults:
  - model: Baseline

data:
  dir_path: ${oc.env:BILLBOARD_AUDIO_ROOT,data}
  df_path: csv/billboard_hot100_chosen.csv
  json_path: csv/billboard_artist_split.json
  adv_dir_path: ${oc.env:MELON_AUDIO_ROOT,kpop_data}
  adv_df_path: csv/korean_melon_meta_chosen.csv
  adv_json_path: csv/kpop_artist_split.json

train:
  seed: 77
  batch_size: 64
  learning_rate: 1e-4
  iterations_per_chunk: 30000
  validation_freq: 500
  num_chunks: 1
  high_to_low_weight: 1
  low_to_high_weight: 1
  adversarial_loss_weight: 0

train_model_with_chunks:
  json_path: ${data.adv_json_path}
  cycles: 1
  num_chunks: ${train.num_chunks}

train_set:
  dir_path: ${data.adv_dir_path}
  df_path: ${data.adv_df_path}
  json_path: ${data.adv_json_path}
  sr: ${model.cfg.sr}
  channel: ${model.cfg.channel}
  clip_len: 30
  data_type: kpop
  equalize: False               # Melon has only 5 populated decades; trained unbalanced

valid_test:
  dir_path: ${data.adv_dir_path}
  df_path: ${data.adv_df_path}
  json_path: ${data.adv_json_path}
  sr: ${model.cfg.sr}
  channel: ${model.cfg.channel}
  clip_len: 30
  data_type: kpop
  equalize: False

